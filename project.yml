name: Pupitre
options:
  bundleIdPrefix: com.riste47
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.4"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4E8L27Z9Z2          # Personal Team d'Evariste : plus besoin de la choisir dans Xcode
targets:
  Pupitre:
    type: application
    platform: iOS
    sources: [Pupitre/Sources, Pupitre/Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riste47.pupitre
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Pupitre
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID sert à déverrouiller les Réglages de Pupitre sans retaper ton code."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
