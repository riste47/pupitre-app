# Jalon 1 : compile Pupitre pour le simulateur iPhone ET iPad sur un Mac de GitHub, puis filme l'app (vidéo + captures).
# Résultat : onglet « Actions » › dernier passage › « Artifacts » › pupitre-apercu (vidéos .mp4 + captures .png).
name: Aperçu simulateur
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apercu:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: |
          brew install xcodegen
          xcodebuild -version
      - name: Générer le projet Xcode
        run: xcodegen generate
      - name: Déposer le projet Xcode prêt à ouvrir dans la branche « xcode » (installation sur iPhone/iPad via le Mac)
        run: |
          rm -rf /tmp/x && mkdir /tmp/x && cp -R Pupitre Pupitre.xcodeproj project.yml README.md /tmp/x/
          cd /tmp/x && git init -q -b xcode
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Projet Xcode ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" xcode
      - name: Compiler pour le simulateur
        run: |
          set -o pipefail
          xcodebuild -project Pupitre.xcodeproj -scheme Pupitre -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: Filmer sur iPhone et iPad
        run: bash scripts/record.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pupitre-apercu
          path: out/
          if-no-files-found: warn
      - name: Déposer l'aperçu dans la branche « apercu » (lisible sans téléchargement)
        if: always()
        run: |
          cd out
          git init -q -b apercu
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Aperçu ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apercu
